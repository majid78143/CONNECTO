<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5865f2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5865f2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#glow)"/>
  <!-- Nodes -->
  <circle cx="20" cy="50" r="10" fill="#5865f2"/>
  <circle cx="50" cy="20" r="10" fill="#9b59b6"/>
  <circle cx="80" cy="50" r="10" fill="#5865f2"/>
  <circle cx="50" cy="80" r="10" fill="#57f287"/>
  <circle cx="50" cy="50" r="6" fill="#ffffff" opacity="0.9"/>
  <!-- Lines -->
  <line x1="20" y1="50" x2="50" y2="20" stroke="#5865f2" stroke-width="3" opacity="0.7"/>
  <line x1="50" y1="20" x2="80" y2="50" stroke="#9b59b6" stroke-width="3" opacity="0.7"/>
  <line x1="80" y1="50" x2="50" y2="80" stroke="#5865f2" stroke-width="3" opacity="0.7"/>
  <line x1="50" y1="80" x2="20" y2="50" stroke="#57f287" stroke-width="3" opacity="0.7"/>
  <line x1="20" y1="50" x2="50" y2="50" stroke="#5865f2" stroke-width="2" opacity="0.4"/>
  <line x1="50" y1="20" x2="50" y2="50" stroke="#9b59b6" stroke-width="2" opacity="0.4"/>
  <line x1="80" y1="50" x2="50" y2="50" stroke="#5865f2" stroke-width="2" opacity="0.4"/>
  <line x1="50" y1="80" x2="50" y2="50" stroke="#57f287" stroke-width="2" opacity="0.4"/>
  <animateTransform attributeName="transform" type="rotate" values="0 50 50;360 50 50" dur="20s" repeatCount="indefinite"/>
</svg>
