{% extends "base.html" %}
{% block title %}Login — CONNECTO{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-primary);padding:20px">
  <!-- Animated background -->
  <div id="particles-bg" style="position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0"></div>

  <div style="width:100%;max-width:420px;position:relative;z-index:1">
    <!-- Logo -->
    <div style="text-align:center;margin-bottom:32px">
      <a href="/" style="text-decoration:none">
        <div style="display:inline-flex;align-items:center;gap:10px">
          <svg width="40" height="40" viewBox="0 0 40 40" style="filter:drop-shadow(0 0 10px #5865f2)">
            <circle cx="20" cy="20" r="18" fill="#5865f2" opacity=".15"/>
            <circle cx="10" cy="20" r="4" fill="#5865f2"/>
            <circle cx="20" cy="10" r="4" fill="#9b59b6"/>
            <circle cx="30" cy="20" r="4" fill="#5865f2"/>
            <circle cx="20" cy="30" r="4" fill="#57f287"/>
            <line x1="10" y1="20" x2="20" y2="10" stroke="#5865f2" stroke-width="2" opacity=".6"/>
            <line x1="20" y1="10" x2="30" y2="20" stroke="#9b59b6" stroke-width="2" opacity=".6"/>
            <line x1="30" y1="20" x2="20" y2="30" stroke="#5865f2" stroke-width="2" opacity=".6"/>
            <line x1="20" y1="30" x2="10" y2="20" stroke="#57f287" stroke-width="2" opacity=".6"/>
            <animateTransform attributeName="transform" type="rotate" values="0 20 20;360 20 20" dur="20s" repeatCount="indefinite"/>
          </svg>
          <span style="font-family:var(--font-logo);font-size:28px;font-weight:800;background:linear-gradient(135deg,#5865f2,#9b59b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent">CONNECTO</span>
        </div>
      </a>
    </div>

    <div class="card" style="padding:32px">
      <h2 style="text-align:center;margin-bottom:8px;font-size:22px">Welcome back!</h2>
      <p style="text-align:center;color:var(--text-muted);margin-bottom:24px;font-size:14px">Sign in to continue to CONNECTO</p>

      <div id="error-msg" class="hidden" style="background:rgba(237,66,69,0.1);border:1px solid var(--accent-red);border-radius:var(--radius-md);padding:10px 14px;color:var(--accent-red);font-size:14px;margin-bottom:16px"></div>

      <!-- Google Login -->
      <button class="btn btn-secondary" id="google-btn" style="width:100%;justify-content:center;margin-bottom:16px" onclick="loginGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M47.5 24.6c0-1.6-.1-3.1-.4-4.6H24v8.7h13.2c-.6 3-2.3 5.5-4.9 7.2v6h7.9c4.6-4.3 7.3-10.6 7.3-17.3z"/><path fill="#34A853" d="M24 48c6.5 0 12-2.2 16-5.9l-7.9-6c-2.2 1.5-5 2.3-8.1 2.3-6.2 0-11.5-4.2-13.4-9.9H2.4v6.2C6.4 42.5 14.6 48 24 48z"/><path fill="#FBBC05" d="M10.6 28.5c-.5-1.5-.8-3-.8-4.5s.3-3 .8-4.5v-6.2H2.4C.9 16.5 0 20.1 0 24s.9 7.5 2.4 10.7l8.2-6.2z"/><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.4 5.5 2.4 13.3l8.2 6.2C12.5 13.7 17.8 9.5 24 9.5z"/></svg>
        Continue with Google
      </button>

      <div class="divider">or</div>

      <form id="login-form" onsubmit="return loginEmail(event)">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="input" type="email" id="email" placeholder="you@example.com" required autocomplete="email"/>
        </div>
        <div class="form-group">
          <label class="form-label" style="display:flex;justify-content:space-between">
            <span>Password</span>
            <a href="#" onclick="forgotPassword()" style="font-size:12px;color:var(--accent-blue)">Forgot password?</a>
          </label>
          <div style="position:relative">
            <input class="input" type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" style="padding-right:44px"/>
            <button type="button" onclick="togglePwd()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted)">
              <svg id="pwd-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button class="btn btn-primary" type="submit" id="login-btn" style="width:100%;justify-content:center;margin-top:8px">
          <span id="login-text">Sign In</span>
          <div class="spinner hidden" id="login-spinner" style="width:16px;height:16px;border-width:2px"></div>
        </button>
      </form>

      <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--text-muted)">
        Don't have an account? <a href="/auth/register" style="color:var(--accent-blue);font-weight:600">Register</a>
      </p>
    </div>
  </div>
</div>

<script>
async function loginEmail(e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const pwd   = document.getElementById('password').value;
  setLoading(true);
  try {
    await auth.signInWithEmailAndPassword(email, pwd);
    window.location.href = '/app';
  } catch(err) {
    showError(getFriendlyError(err.code));
    setLoading(false);
  }
  return false;
}

async function loginGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    await auth.signInWithPopup(provider);
    window.location.href = '/app';
  } catch(err) {
    showError(getFriendlyError(err.code));
  }
}

async function forgotPassword() {
  const email = document.getElementById('email').value;
  if (!email) { showError('Enter your email first'); return; }
  try {
    await auth.sendPasswordResetEmail(email);
    showError('Password reset email sent! Check your inbox.', 'success');
  } catch(err) {
    showError(getFriendlyError(err.code));
  }
}

function getFriendlyError(code) {
  const msgs = {
    'auth/user-not-found':   'No account found with this email.',
    'auth/wrong-password':   'Incorrect password. Try again.',
    'auth/invalid-email':    'Please enter a valid email.',
    'auth/too-many-requests':'Too many attempts. Try again later.',
    'auth/user-disabled':    'This account has been disabled.',
  };
  return msgs[code] || 'Something went wrong. Please try again.';
}

function showError(msg, type='error') {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.className   = '';
  el.style.background = type==='success' ? 'rgba(87,242,135,0.1)' : 'rgba(237,66,69,0.1)';
  el.style.borderColor = type==='success' ? 'var(--accent-green)' : 'var(--accent-red)';
  el.style.color = type==='success' ? 'var(--accent-green)' : 'var(--accent-red)';
  el.style.display='block';
}

function setLoading(v) {
  document.getElementById('login-text').classList.toggle('hidden', v);
  document.getElementById('login-spinner').classList.toggle('hidden', !v);
  document.getElementById('login-btn').disabled = v;
}

function togglePwd() {
  const inp = document.getElementById('password');
  inp.type  = inp.type === 'password' ? 'text' : 'password';
}

// Particles bg
(function() {
  const bg = document.getElementById('particles-bg');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    const size = Math.random()*6+3;
    p.className = 'particle';
    p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;background:${['#5865f2','#9b59b6','#57f287'][Math.floor(Math.random()*3)]};opacity:${Math.random()*.3+.1};animation-duration:${Math.random()*10+8}s;animation-delay:${Math.random()*8}s`;
    bg.appendChild(p);
  }
})();
</script>
{% endblock %}
