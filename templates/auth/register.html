{% extends "base.html" %}
{% block title %}Register — CONNECTO{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-primary);padding:20px">
  <div id="particles-bg" style="position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0"></div>
  <div style="width:100%;max-width:420px;position:relative;z-index:1">
    <div style="text-align:center;margin-bottom:32px">
      <a href="/" style="text-decoration:none">
        <span style="font-family:var(--font-logo);font-size:28px;font-weight:800;background:linear-gradient(135deg,#5865f2,#9b59b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent">CONNECTO</span>
      </a>
    </div>
    <div class="card" style="padding:32px">
      <h2 style="text-align:center;margin-bottom:8px;font-size:22px">Create account</h2>
      <p style="text-align:center;color:var(--text-muted);margin-bottom:24px;font-size:14px">Join CONNECTO for free</p>
      <div id="error-msg" class="hidden" style="background:rgba(237,66,69,0.1);border:1px solid var(--accent-red);border-radius:var(--radius-md);padding:10px 14px;color:var(--accent-red);font-size:14px;margin-bottom:16px;display:none"></div>
      <button class="btn btn-secondary" style="width:100%;justify-content:center;margin-bottom:16px" onclick="registerGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M47.5 24.6c0-1.6-.1-3.1-.4-4.6H24v8.7h13.2c-.6 3-2.3 5.5-4.9 7.2v6h7.9c4.6-4.3 7.3-10.6 7.3-17.3z"/><path fill="#34A853" d="M24 48c6.5 0 12-2.2 16-5.9l-7.9-6c-2.2 1.5-5 2.3-8.1 2.3-6.2 0-11.5-4.2-13.4-9.9H2.4v6.2C6.4 42.5 14.6 48 24 48z"/><path fill="#FBBC05" d="M10.6 28.5c-.5-1.5-.8-3-.8-4.5s.3-3 .8-4.5v-6.2H2.4C.9 16.5 0 20.1 0 24s.9 7.5 2.4 10.7l8.2-6.2z"/><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.4 5.5 2.4 13.3l8.2 6.2C12.5 13.7 17.8 9.5 24 9.5z"/></svg>
        Continue with Google
      </button>
      <div class="divider">or</div>
      <form onsubmit="return registerEmail(event)">
        <div class="form-group">
          <label class="form-label">Display Name</label>
          <input class="input" id="name" type="text" placeholder="Your name" required maxlength="32"/>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="input" id="email" type="email" placeholder="you@example.com" required/>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="input" id="password" type="password" placeholder="Min 8 characters" required minlength="8"/>
          <div class="form-hint">Use a mix of letters, numbers, and symbols</div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input class="input" id="confirm" type="password" placeholder="Repeat your password" required/>
        </div>
        <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:16px;font-size:13px;color:var(--text-muted)">
          <input type="checkbox" id="agree" required style="margin-top:2px"/>
          <label for="agree">I agree to the <a href="/terms" target="_blank" style="color:var(--accent-blue)">Terms</a> and <a href="/privacy" target="_blank" style="color:var(--accent-blue)">Privacy Policy</a></label>
        </div>
        <button class="btn btn-primary" type="submit" id="reg-btn" style="width:100%;justify-content:center">
          <span id="reg-text">Create Account</span>
          <div class="spinner hidden" id="reg-spinner" style="width:16px;height:16px;border-width:2px"></div>
        </button>
      </form>
      <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--text-muted)">
        Already have an account? <a href="/auth/login" style="color:var(--accent-blue);font-weight:600">Sign In</a>
      </p>
    </div>
  </div>
</div>
<script>
async function registerEmail(e) {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const email= document.getElementById('email').value.trim();
  const pwd  = document.getElementById('password').value;
  const conf = document.getElementById('confirm').value;
  if (pwd !== conf) { showErr('Passwords do not match'); return false; }
  setLoad(true);
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pwd);
    await cred.user.updateProfile({ displayName: name });
    window.location.href = '/app';
  } catch(err) {
    const msgs={'auth/email-already-in-use':'This email is already registered.','auth/weak-password':'Password is too weak (min 8 chars).'};
    showErr(msgs[err.code]||'Registration failed. Try again.');
    setLoad(false);
  }
  return false;
}
async function registerGoogle() {
  try {
    await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    window.location.href = '/app';
  } catch(e) { showErr('Google sign-in failed'); }
}
function showErr(m) { const el=document.getElementById('error-msg'); el.textContent=m; el.style.display='block'; }
function setLoad(v) { document.getElementById('reg-text').classList.toggle('hidden',v); document.getElementById('reg-spinner').classList.toggle('hidden',!v); document.getElementById('reg-btn').disabled=v; }
(function(){const bg=document.getElementById('particles-bg');for(let i=0;i<20;i++){const p=document.createElement('div');const s=Math.random()*6+3;p.className='particle';p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;background:${['#5865f2','#9b59b6','#57f287'][Math.floor(Math.random()*3)]};opacity:${Math.random()*.3+.1};animation-duration:${Math.random()*10+8}s;animation-delay:${Math.random()*8}s`;bg.appendChild(p);}})();
</script>
{% endblock %}
